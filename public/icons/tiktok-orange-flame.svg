<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- TikTok Blazing Orange Flame Gradient -->
    <linearGradient id="ttOrangeBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF2A38"/>
      <stop offset="35%" stop-color="#FF5A00"/>
      <stop offset="70%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>

    <!-- Glowing Warm Core Droplet -->
    <linearGradient id="ttOrangeCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF385" stop-opacity="0.95"/>
      <stop offset="90%" stop-color="#FFB300" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF5A00" stop-opacity="0"/>
    </linearGradient>

    <!-- Orange Aura Glow -->
    <filter id="ttOrangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF3D00" flood-opacity="0.6"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Crown Flame Silhouette -->
  <path d="M50 88
           C32 88 20 76 19 62
           C18 52 23 45 19 40
           C18 39 17 40 18 42
           C20 48 20 54 24 52
           C19 46 19 38 23 30
           C24 28 23 28 22 30
           C21 34 22 40 26 38
           C24 30 27 22 33 15
           C34 13 33 13 32 15
           C31 19 32 25 38 23
           C35 15 40 8 48 2.5
           C49 1.5 50 3 49 5
           C46 11 45 19 53 19
           C50 12 56 6 65 6
           C66 6 67 8 66 10
           C62 16 63 23 70 21
           C68 15 73 11 80 15
           C81 16 80 17 79 17
           C74 21 74 27 81 28
           C79 23 83 22 89 28
           C90 29 89 30 88 30
           C83 34 84 41 91 39
           C88 44 89 50 92 50
           C93 50 93 48 92 46
           C91 43 94 40 92 36
           C91 48 93 58 91 63
           C89 77 78 88 50 88 Z"
        fill="url(#ttOrangeBody)"
        filter="url(#ttOrangeGlow)"/>

  <!-- Inner Water-Drop Core Light -->
  <path d="M50 42
           C50 42 38 58 38 68
           C38 75.5 43.4 81 50 81
           C56.6 81 62 75.5 62 68
           C62 58 50 42 50 42 Z"
        fill="url(#ttOrangeCore)"/>

  <!-- Golden Sparkles -->
  <path d="M88 42 Q92 42 92 38 Q92 42 96 42 Q92 42 92 46 Q92 42 88 42 Z" fill="#FFE57F"/>
  <path d="M80 62 Q83 62 83 59 Q83 62 86 62 Q83 62 83 65 Q83 62 80 62 Z" fill="#FFD54F"/>
  <path d="M10 60 Q13 60 13 57 Q13 60 16 60 Q13 60 13 63 Q13 60 10 60 Z" fill="#FFE57F"/>
</svg>